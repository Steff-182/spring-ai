spring:
  application:
    name: embedding-service
  ai:
    model:
      embedding: transformers
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${PGVECTOR_USER:postgres}
    password: ${PGVECTOR_PASSWORD:postgres=}
    driver-class-name: org.postgresql.Driver
  embedding:
    transformer:
      tokenizer:
        uri: ${EMBED_TOKENIZER_URI:file:./models/all-MiniLM-L6-v2/tokenizer.json}
        options:
          padding: true
      onnx:
        modelUri: ${EMBED_MODEL_URI:file:./models/all-MiniLM-L6-v2/model.onnx}
        modelOutputName: ${EMBED_MODEL_OUTPUT_NAME:last_hidden_state}

app:
  embedding:
    dimensions: ${EMBED_DIMENSIONS:384}
    vector-table: ${EMBED_VECTOR_TABLE:vector_store_embedding}

server:
  port: 8090
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.embedding: INFO
